name: Release

# 推送到 main（或打 v* tag）时自动发布：
# - 版本号已在 npm 上存在 → 只做校验，不重复发布；
# - 版本号是新的 → npm publish（npm trusted publishing / OIDC，无 token）+ GitHub Release。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # trusted publishing：向 npm 换取 OIDC token，并自动生成 provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 必须与 npm 侧 trusted publisher 的 "Environment" 完全一致（截图里是 release）。
    # 不一致时 registry 的 OIDC 交换会返回 404，npm 随后静默退回传统认证并报 ENEEDAUTH。
    environment: release
    steps:
      - uses: actions/checkout@v4

      # 不要用 registry-url：actions/setup-node 会写入
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，而 trusted publishing
      # 要求完全没有 token，否则 npm 会退回 token 认证而不用 OIDC。
      # 仓库地址来自 package.json 的 publishConfig.registry。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install --global npm@latest
          version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $version is too old; trusted publishing requires npm >= 11.5.1"
            exit 1
          fi
          echo "npm $version supports trusted publishing"

      - name: Read package metadata
        id: meta
        run: |
          node -e '
            const { appendFileSync } = require("node:fs")
            const pkg = require("./package.json")
            appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\n`)
            console.log(`package: ${pkg.name}@${pkg.version}`)
          '

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node -e '
            const pkg = require("./package.json")
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (pkg.version !== tag) {
              console.error(`tag ${tag} does not match package version ${pkg.version}`)
              process.exit(1)
            }
          '

      - name: Verify package shape
        run: npm run check

      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is new — will publish"
          fi

      # npm 在拿不到 OIDC 凭证时会静默退回传统认证，只报 "ENEEDAUTH / npm login"，
      # 看不出到底是 OIDC 权限没给、还是 npm 侧 trusted publisher 没匹配。
      # 这里手动走一遍同样的交换，把 registry 的真实状态码和报错打出来。
      - name: Preflight npm trusted publishing
        if: steps.registry.outputs.published == 'false'
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub did not expose an OIDC endpoint to this job; the workflow needs 'permissions: id-token: write'."
            exit 1
          fi

          id_token="$(curl -sS -H "authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value')"
          if [ -z "${id_token}" ] || [ "${id_token}" = "null" ]; then
            echo "::error::could not obtain a GitHub OIDC token for audience npm:registry.npmjs.org"
            exit 1
          fi

          status="$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${{ steps.meta.outputs.name }}")"
          echo "token exchange HTTP ${status}"

          case "${status}" in
            2*)
              echo "trusted publisher matched; handing off to npm publish"
              ;;
            *)
              echo "--- registry response ---"
              cat exchange.json
              echo "-------------------------"
              echo "::error::npm rejected the OIDC token exchange (HTTP ${status}). Fix the package's trusted publisher on npmjs.com: user/repo = ${{ github.repository }}, workflow filename = release.yml (basename only), environment = none (the workflow declares no environment)."
              rm -f exchange.json
              exit 1
              ;;
          esac
          rm -f exchange.json

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        # trusted publishing：不传 NODE_AUTH_TOKEN / NPM_TOKEN，npm 用 id-token 换短期凭证，
        # provenance 自动生成（--provenance 可省略，这里显式写出便于排查）。
        run: npm publish --access public --provenance

      - name: Verify the version is readable on npm
        if: steps.registry.outputs.published == 'false'
        # npm can exit 0 without the version ever landing in the registry; confirm
        # it is actually readable before announcing a release.
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
              echo "::notice::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is live on npm"
              exit 0
            fi
            echo "attempt ${attempt}: not readable yet, retrying in 10s"
            sleep 10
          done
          echo "::error::npm publish exited successfully but ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is not readable from the registry"
          exit 1

      - name: Check whether the GitHub Release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release v${{ steps.meta.outputs.version }} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack release tarball
        if: steps.release.outputs.exists == 'false'
        run: npm pack

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: '*.tgz'
          generate_release_notes: true
          fail_on_unmatched_files: true
